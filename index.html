<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Porra Mundial 2026 · Cooidi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    /* ── TOKENS ── */
    :root {
      --bg:        #0B2333;
      --surface:   #112B40;
      --surface2:  #163650;
      --border:    #1D4262;
      --gold:      #EAC535;
      --gold-lt:   #F2D355;
      --gold-dk:   #B89210;
      --navy:      #0C2B3C;
      --text:      #EDF2F7;
      --muted:     #6B8EA6;
      --muted2:    #4A7090;
      --green:     #27AE60;
      --red:       #E74C3C;
      --r:         8px;
      --r-sm:      6px;
      --bottom-nav-h: 68px;
    }

    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      line-height: 1.55;
      overscroll-behavior: none;
    }

    /* ══════════════════════════════════════════
       DESKTOP NAV (Cooidi floating pill style)
    ══════════════════════════════════════════ */
    .topbar {
      background: var(--navy);
      padding: 14px 24px;
      position: sticky;
      top: 0;
      z-index: 300;
      border-bottom: 2px solid var(--gold);
    }
    .nav-pill {
      background: #fff;
      border-radius: 12px;
      padding: 8px 8px 8px 16px;
      display: flex;
      align-items: center;
      gap: 0;
      max-width: 1080px;
      margin: 0 auto;
      box-shadow: 0 4px 24px rgba(0,0,0,0.35);
    }
    .nav-logo img {
      height: 38px;
      width: auto;
      display: block;
    }
    .nav-sep {
      width: 1px;
      height: 28px;
      background: #e2e8f0;
      margin: 0 16px;
      flex-shrink: 0;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
    }
    .nav-link {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      color: #4A5568;
      background: none;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s, color .15s;
      white-space: nowrap;
      letter-spacing: 0.1px;
    }
    .nav-link:hover { background: #f0f4f8; color: var(--navy); }
    .nav-link.active { color: var(--gold-dk); background: rgba(234,197,53,0.12); }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 8px;
    }
    .nav-badge {
      font-size: 0.7rem;
      font-weight: 600;
      color: #718096;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 5px 12px;
      white-space: nowrap;
    }
    .nav-badge b { color: var(--navy); }
    .nav-admin-btn {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      color: #fff;
      background: var(--navy);
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .nav-admin-btn:hover { background: #0F3550; }

    /* ══════════════════════════════════════════
       MOBILE BOTTOM NAV
    ══════════════════════════════════════════ */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 300;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .bn-inner {
      display: flex;
      height: var(--bottom-nav-h);
    }
    .bn-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 6px 2px 2px;
      transition: color .15s;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    .bn-item.active { color: var(--gold); }
    .bn-item.active::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 2px;
      background: var(--gold);
      border-radius: 0 0 2px 2px;
    }
    .bn-icon { font-size: 1.35rem; line-height: 1; }
    .bn-label { font-size: 0.55rem; font-weight: 700; letter-spacing: 0.2px; line-height: 1; }

    /* ══════════════════════════════════════════
       LAYOUT
    ══════════════════════════════════════════ */
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 20px;
    }
    .section { display: none; }
    .section.active { display: block; }

    /* ══════════════════════════════════════════
       CARD
    ══════════════════════════════════════════ */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 20px 22px;
      margin-bottom: 14px;
    }
    .card-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-label a {
      color: var(--gold);
      text-decoration: none;
      font-size: 0.65rem;
      letter-spacing: 0.5px;
      font-weight: 700;
    }

    /* ══════════════════════════════════════════
       PODIUM
    ══════════════════════════════════════════ */
    .podium {
      display: grid;
      grid-template-columns: 1fr 1.12fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
      align-items: end;
    }
    .pod {
      border-radius: var(--r);
      padding: 20px 12px 18px;
      text-align: center;
      border: 1px solid var(--border);
      background: var(--surface);
      position: relative;
      overflow: hidden;
    }
    .pod::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
    }
    .pod.p1 {
      background: var(--surface);
      border-color: rgba(234,197,53,.5);
      padding-top: 16px;
    }
    .pod.p1::before { background: radial-gradient(ellipse at 50% 0%, rgba(234,197,53,.1) 0%, transparent 70%); opacity:1; }
    .pod.p2::before { background: radial-gradient(ellipse at 50% 0%, rgba(189,195,199,.07) 0%, transparent 70%); opacity:1; }
    .pod.p3::before { background: radial-gradient(ellipse at 50% 0%, rgba(205,127,50,.07) 0%, transparent 70%); opacity:1; }

    /* Avatar circular */
    .pod-avatar {
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      margin: 0 auto 12px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      animation: podPop .55s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
    }
    .pod-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
    .pod-avatar.av1 {
      width: 96px; height: 96px; font-size: 2.2rem;
      border: 3px solid #EAC535;
      box-shadow: 0 0 0 5px rgba(234,197,53,.2), 0 12px 32px rgba(0,0,0,.55);
      animation-delay: .35s;
    }
    .pod-avatar.av2 {
      width: 78px; height: 78px; font-size: 1.75rem;
      border: 3px solid #BDC3C7;
      box-shadow: 0 0 0 4px rgba(189,195,199,.18), 0 8px 22px rgba(0,0,0,.45);
      animation-delay: .1s;
    }
    .pod-avatar.av3 {
      width: 74px; height: 74px; font-size: 1.6rem;
      border: 3px solid #CD7F32;
      box-shadow: 0 0 0 4px rgba(205,127,50,.18), 0 8px 20px rgba(0,0,0,.4);
      animation-delay: .22s;
    }
    @keyframes podPop {
      from { opacity:0; transform:scale(.35) translateY(20px); }
      to   { opacity:1; transform:scale(1) translateY(0); }
    }
    .pod-crown { font-size: 1.3rem; margin-bottom: 6px; }
    .pod-pos-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%;
      font-size: 0.68rem; font-weight: 900;
      margin: 0 auto 6px;
    }
    .pod-pos-badge.pb1 { background: #EAC535; color: var(--navy); }
    .pod-pos-badge.pb2 { background: #BDC3C7; color: #1a1a1a; }
    .pod-pos-badge.pb3 { background: #CD7F32; color: #fff; }
    .pod-name { font-size: 0.82rem; font-weight: 700; margin-bottom: 8px; word-break: break-word; line-height: 1.3; }
    .pod-pts { font-size: 1.9rem; font-weight: 900; line-height: 1; margin-bottom: 2px; }
    .pod-pts.c1 { color: var(--gold); }
    .pod-pts.c2 { color: #BDC3C7; }
    .pod-pts.c3 { color: #CD7F32; }
    .pod-sub { font-size: 0.6rem; color: var(--muted); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
    .pod-platform {
      margin: 14px -12px -18px;
      padding: 8px 0;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .pod.p1 .pod-platform { background: rgba(234,197,53,.15); color: var(--gold-lt); }
    .pod.p2 .pod-platform { background: rgba(189,195,199,.08); color: #BDC3C7; height: 32px; }
    .pod.p3 .pod-platform { background: rgba(205,127,50,.08); color: #CD7F32; height: 20px; }

    /* Photo upload grid (admin) */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .photo-card {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      padding: 10px 6px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--r-sm); cursor: pointer;
      transition: border-color .15s, background .15s;
      text-align: center;
    }
    .photo-card:hover { border-color: var(--gold); background: rgba(234,197,53,.04); }
    .photo-card:active { transform: scale(.97); }
    .photo-thumb {
      width: 52px; height: 52px; border-radius: 50%;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 1.1rem; color: #fff;
      border: 2px solid var(--border); flex-shrink: 0;
    }
    .photo-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .photo-card-name { font-size: 0.62rem; font-weight: 700; line-height: 1.3; color: var(--text); }
    .photo-card-hint { font-size: 0.55rem; color: var(--muted); }

    /* ══════════════════════════════════════════
       RANKING TABLE
    ══════════════════════════════════════════ */
    .t-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; }
    th {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }
    th:not(:first-child):not(:nth-child(2)) { text-align: center; }
    td { padding: 13px 12px; border-bottom: 1px solid rgba(29,66,98,.6); font-size: 0.86rem; }
    td:not(:first-child):not(:nth-child(2)) { text-align: center; color: var(--muted); font-size: 0.8rem; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.022); }
    .td-pos { font-weight: 700; color: var(--muted2); font-size: 0.8rem; width: 32px; }
    .td-pos.hi { color: var(--gold); }
    .td-name { font-weight: 700; }
    .td-total { font-weight: 800 !important; color: var(--text) !important; font-size: 0.92rem !important; }

    /* ══════════════════════════════════════════
       MINI RANKING (inicio)
    ══════════════════════════════════════════ */
    .rank-item {
      display: flex;
      align-items: center;
      padding: 11px 0;
      gap: 12px;
      border-bottom: 1px solid rgba(29,66,98,.6);
    }
    .rank-item:last-child { border-bottom: none; }
    .rank-n { font-size: 0.72rem; font-weight: 800; color: var(--muted2); width: 22px; text-align: center; }
    .rank-n.hi { color: var(--gold); }
    .rank-name { flex: 1; font-weight: 600; font-size: 0.88rem; }
    .rank-pts { font-weight: 900; font-size: 1rem; color: var(--gold); }

    /* ══════════════════════════════════════════
       MATCH CARDS
    ══════════════════════════════════════════ */
    .phase-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--gold);
      margin: 22px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .phase-label::before {
      content: '';
      display: block;
      width: 3px;
      height: 13px;
      background: var(--gold);
      border-radius: 2px;
      flex-shrink: 0;
    }
    .mgrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 8px;
    }
    .mcard {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 12px 14px;
      transition: border-color .15s, transform .1s;
    }
    .mcard:active { transform: scale(.99); }
    .mcard.today { border-color: rgba(234,197,53,.45); background: rgba(234,197,53,.04); }
    .mcard.played { border-left: 2px solid rgba(39,174,96,.5); }
    .mcard.finished { border-left: 2px solid var(--gold); }
    .fin-badge { background:rgba(234,197,53,.15); color:var(--gold); font-size:.55rem; font-weight:800; letter-spacing:1px; padding:1px 5px; border-radius:3px; border:1px solid rgba(234,197,53,.3); }
    .mscore-num.scored { color:#4ade80; }
    .mcard-date {
      font-size: 0.66rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 10px;
    }
    .live-dot {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: var(--red);
      font-weight: 700;
    }
    .live-dot::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--red);
      border-radius: 50%;
      animation: pulse-dot 1.2s infinite;
    }
    @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }
    .mcard-teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }
    .mteam { flex: 1; text-align: center; }
    .mteam-flag {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 34px;
      margin-bottom: 2px;
    }
    .flag-img {
      width: 42px;
      height: auto;
      border-radius: 3px;
      box-shadow: 0 1px 6px rgba(0,0,0,.45);
      display: block;
    }
    .flag-unknown {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 28px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 3px;
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 700;
    }
    .mteam-name { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2px; margin-top: 4px; line-height: 1.2; color: var(--text); }
    .mscore-box { text-align: center; min-width: 54px; }
    .mscore-num { font-size: 1.55rem; font-weight: 900; letter-spacing: -1px; line-height: 1; color: var(--gold); }
    .mscore-sep { color: var(--muted2); margin: 0 1px; font-size: 1rem; }
    .mscore-vs {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--muted2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      letter-spacing: 1px;
    }
    .mscore-phase { font-size: 0.58rem; color: var(--muted); margin-top: 3px; font-weight: 600; letter-spacing: 0.2px; }

    /* ══════════════════════════════════════════
       PREDICTIONS
    ══════════════════════════════════════════ */
    .pred-sel-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .pred-sel-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
    select {
      font-family: 'Montserrat', sans-serif;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      color: var(--text);
      padding: 9px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      outline: none;
    }
    select:focus { border-color: var(--gold); }
    .pred-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: 1px solid rgba(29,66,98,.6);
    }
    .pred-row:last-child { border-bottom: none; }
    .pred-i { font-size: 0.7rem; font-weight: 700; color: var(--muted2); width: 18px; text-align: center; flex-shrink: 0; }
    .pred-name { flex: 1; font-weight: 600; font-size: 0.88rem; }
    .pred-chip {
      padding: 5px 10px;
      border-radius: var(--r-sm);
      font-weight: 800;
      font-size: 0.88rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      min-width: 62px;
      text-align: center;
      letter-spacing: -0.3px;
      flex-shrink: 0;
      font-family: 'Montserrat', monospace;
    }
    /* exact result = 5 pts */
    .pred-chip.exact    { background: rgba(39,174,96,.15);  border-color: rgba(39,174,96,.55);  color: #2ECC71; }
    /* sign + goal diff correct = 2 pts */
    .pred-chip.signdiff { background: rgba(234,197,53,.13); border-color: rgba(234,197,53,.45); color: var(--gold-lt); }
    /* sign only correct = 1 pt */
    .pred-chip.signok   { background: rgba(91,165,255,.1);  border-color: rgba(91,165,255,.35); color: #7EC8FF; }
    /* wrong sign = 0 pts */
    .pred-chip.wrong    { background: rgba(231,76,60,.1);   border-color: rgba(231,76,60,.3);   color: #E74C3C; }
    .pred-pts-badge {
      font-size: 0.6rem; font-weight: 800; padding: 2px 6px;
      border-radius: 4px; flex-shrink: 0; letter-spacing: 0.3px;
    }
    .pred-pts-badge.exact    { background: rgba(39,174,96,.2);  color: #2ECC71; }
    .pred-pts-badge.signdiff { background: rgba(234,197,53,.18);color: var(--gold); }
    .pred-pts-badge.signok   { background: rgba(91,165,255,.15);color: #7EC8FF; }
    .pred-pts-badge.wrong    { background: rgba(231,76,60,.12); color: #E74C3C; }
    .pred-result-badge {
      font-size: 0.7rem; font-weight: 700; color: var(--muted);
      white-space: nowrap;
    }
    .pred-result-badge b { color: var(--gold-lt); font-size: 0.82rem; letter-spacing: -0.3px; }

    /* ══════════════════════════════════════════
       ADMIN
    ══════════════════════════════════════════ */
    .lock-center { text-align: center; padding: 52px 20px; }
    .lock-center h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
    .lock-center p { color: var(--muted); font-size: 0.84rem; margin-bottom: 22px; }
    .input-row { display: flex; gap: 8px; justify-content: center; }
    input[type=password], input[type=text] {
      font-family: 'Montserrat', sans-serif;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      color: var(--text);
      padding: 10px 14px;
      font-size: 0.88rem;
      font-weight: 500;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: var(--gold); }
    .btn {
      font-family: 'Montserrat', sans-serif;
      padding: 10px 22px;
      border-radius: var(--r-sm);
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      border: none;
      transition: filter .15s;
      letter-spacing: 0.2px;
    }
    .btn:active { filter: brightness(.9); }
    .btn-gold { background: var(--gold); color: var(--navy); }
    .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-red { background: var(--red); color: #fff; }
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--r);
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      margin-bottom: 14px;
    }
    .drop-zone:hover, .drop-zone.over { border-color: var(--gold); background: rgba(234,197,53,.04); }

<!-- ══════════ SCRIPT ══════════ -->
<script>
'use strict';

const STORAGE_KEY = 'porra-cooidi-2026-v3';
const ADMIN_PWD   = 'cooidi2026';

let S = { participants:[], matches:[], predictions:{}, photos:{}, scoredMatches:{}, lastUpdated:null };
let adminOpen = false;

function loadS() {
  try { const r=localStorage.getItem(STORAGE_KEY); if(r) Object.assign(S,JSON.parse(r)); } catch(e){}
}
function saveS() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    participants:S.participants, matches:S.matches, predictions:S.predictions,
    photos:S.photos, scoredMatches:S.scoredMatches,
    _prevPreds:S._prevPreds, lastUpdated:S.lastUpdated
  }));
}

// ── FLAGS ──────────────────────────────────────────────────────────
const COUNTRY_CODES = {
  'México':'mx','Sudáfrica':'za','Corea del Sur':'kr','República Checa':'cz',
  'Canadá':'ca','Catar':'qa','Suiza':'ch','Bosnia y Herzegovina':'ba',
  'Brasil':'br','Haití':'ht','Escocia':'gb-sct','Marruecos':'ma',
  'Estados Unidos':'us','Australia':'au','Turquía':'tr','Paraguay':'py',
  'Alemania':'de','Costa de Marfil':'ci','Ecuador':'ec','Curazao':'cw',
  'Países Bajos':'nl','Suecia':'se','Túnez':'tn','Japón':'jp',
  'Bélgica':'be','Irán':'ir','Nueva Zelanda':'nz','Egipto':'eg',
  'España':'es','Arabia Saudita':'sa','Uruguay':'uy','Cabo Verde':'cv',
  'Francia':'fr','Irak':'iq','Noruega':'no','Senegal':'sn',
  'Argentina':'ar','Austria':'at','Jordania':'jo','Argelia':'dz',
  'Portugal':'pt','Uzbekistán':'uz','Colombia':'co','RD Congo':'cd',
  'Inglaterra':'gb-eng','Gales':'gb-wls','Ghana':'gh','Panamá':'pa','Croacia':'hr',
  'Venezuela':'ve','Chile':'cl','Perú':'pe','Bolivia':'bo','Honduras':'hn',
  'Costa Rica':'cr','El Salvador':'sv','Guatemala':'gt','Jamaica':'jm',
  'Trinidad y Tobago':'tt','Cuba':'cu','Burkina Faso':'bf','Mali':'ml',
  'Nigeria':'ng','Camerún':'cm','Tanzania':'tz','Angola':'ao','Zambia':'zm',
  'Uganda':'ug','Mozambique':'mz','Kenia':'ke','Etiopía':'et',
  'Guinea':'gn','Benín':'bj','Cabo Verde':'cv','Liberia':'lr',
  'Arabia Saudita':'sa','Emiratos Árabes Unidos':'ae','Iraq':'iq',
  'Siria':'sy','Palestina':'ps','Líbano':'lb','Baréin':'bh',
  'Kuwait':'kw','Omán':'om','Yemen':'ye',
  'China':'cn','India':'in','Indonesia':'id','Vietnam':'vn',
  'Tailandia':'th','Malasia':'my','Filipinas':'ph','Singapur':'sg',
  'Kazajistán':'kz','Armenia':'am','Georgia':'ge','Albania':'al',
  'Serbia':'rs','Ucrania':'ua','Polonia':'pl','Hungría':'hu',
  'Rumanía':'ro','Bulgaria':'bg','Eslovaquia':'sk','Grecia':'gr',
  'Dinamarca':'dk','Finlandia':'fi','Islandia':'is','Irlanda':'ie',
  'Escocia':'gb-sct','Gales':'gb-wls',
};
const flag = t => {
  const code = COUNTRY_CODES[t];
  if (!code) return `<span class="flag-unknown">?</span>`;
  return `<img src="https://flagcdn.com/w40/${code}.png"
               srcset="https://flagcdn.com/w80/${code}.png 2x"
               alt="${t}" class="flag-img"
               loading="lazy"
               onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'flag-unknown',textContent:'?'}))">`;
};

// ── DATES ──────────────────────────────────────────────────────────
function parseDate(v) {
  if (!v && v!==0) return null;
  if (typeof v==='number') return new Date((v-25569)*86400000);
  if (typeof v==='string') {
    const p=v.split('/');
    if (p.length===3) return new Date(+p[2],+p[1]-1,+p[0]);
    const d=new Date(v); return isNaN(d)?null:d;
  }
  return null;
}
function fmtDate(v) {
  const d=parseDate(v); if(!d) return '';
  return d.toLocaleDateString('es-ES',{weekday:'short',day:'2-digit',month:'short'});
}
const _today=()=>{ const t=new Date(); t.setHours(0,0,0,0); return t; };
function isToday(v) { const d=parseDate(v); if(!d) return false; d.setHours(0,0,0,0); return d.getTime()===_today().getTime(); }
function isPast(v) { const d=parseDate(v); if(!d) return false; d.setHours(0,0,0,0); return d<_today(); }
function isTomorrow(v) {
  const d=parseDate(v); if(!d) return false;
  const t=new Date(_today()); t.setDate(t.getDate()+1); d.setHours(0,0,0,0);
  return d.getTime()===t.getTime();
}

// ── EXCEL PARSER ──────────────────────────────────────────────────
function parseExcel(buf) {
  const wb=XLSX.read(new Uint8Array(buf),{type:'array',cellDates:false,cellNF:false});
  const out={participants:[],matches:[],predictions:{},lastUpdated:new Date().toISOString()};

  if (wb.SheetNames.includes('CLAS')) {
    const rows=XLSX.utils.sheet_to_json(wb.Sheets['CLAS'],{header:1,defval:''});
    for (let i=4;i<rows.length;i++) {
      const r=rows[i];
      const name=String(r[2]||'').trim();
      if (!name||name.includes('Pegar')||name==='') break;
      const n=v=>parseFloat(v)||0;
      out.participants.push({pos:0,name,
        totalPts:n(r[3]),gPts:n(r[4]),gPosPts:n(r[5]),
        eq16:n(r[6]),pt16:n(r[7]),eq8:n(r[8]),pt8:n(r[9]),
        eq4:n(r[10]),pt4:n(r[11]),eq2:n(r[12]),pt2:n(r[13]),
        eq34:n(r[14]),eqF:n(r[15]),pt34:n(r[16]),ptF:n(r[17]),honor:n(r[18])
      });
    }
    out.participants.sort((a,b)=>b.totalPts-a.totalPts);
    out.participants.forEach((p,i)=>p.pos=i+1);
  }

  if (wb.SheetNames.includes('WORLDCUP')) {
    const rows=XLSX.utils.sheet_to_json(wb.Sheets['WORLDCUP'],{header:1,defval:''});
    let curGroup='',curPhase='groups',id=1;
    const pm={'1/16':'r16','1/8':'r8','1/4':'qf','1/2':'sf','3-4':'34','F':'final'};
    for (let i=0;i<rows.length;i++) {
      const r=rows[i];
      const mk=String(r[22]||'').trim(),date=r[23],time=String(r[24]||'').trim();
      const round=String(r[25]||'').trim(),home=String(r[26]||'').trim();
      const hg=r[28],ag=r[29],away=String(r[31]||'').trim();
      if (date==='Fecha'||String(date).trim()==='Fecha') continue;
      if (mk) {
        if (/^[A-L]$/.test(mk)){curGroup=mk;curPhase='groups';}
        else if (pm[mk]){curPhase=pm[mk];curGroup=mk;}
        else continue;
      }
      if (!home||(!date&&date!==0)) continue;
      const hgN=(hg!==''&&hg!==undefined)?parseInt(hg):null;
      const agN=(ag!==''&&ag!==undefined)?parseInt(ag):null;
      out.matches.push({id:id++,group:curGroup,phase:curPhase,date,time,round,home,away,
        homeG:(hgN!==null&&!isNaN(hgN))?hgN:null,awayG:(agN!==null&&!isNaN(agN))?agN:null});
    }
  }

  if (wb.SheetNames.includes('DailyPrediction')) {
    const rows=XLSX.utils.sheet_to_json(wb.Sheets['DailyPrediction'],{header:1,defval:''});
    const hdrs=[];
    if (rows[2]) for(let c=6;c<rows[2].length;c++){
      const v=String(rows[2][c]||'').replace(/\n/g,' ').trim();
      if(v) hdrs.push({col:c,name:v});
    }
    for(let i=3;i<Math.min(rows.length,20);i++){
      const r=rows[i];
      const pn=String(r[5]||'').trim();
      if(!pn||pn.includes('Pegar')||pn==='') continue;
      hdrs.forEach(h=>{
        const pred=String(r[h.col]||'').trim();
        if(pred&&pred!=='-'&&pred!=='#'){
          if(!out.predictions[h.name]) out.predictions[h.name]=[];
          out.predictions[h.name].push({name:pn,pred});
        }
      });
    }
  }
  return out;
}

const PLBL={groups:'',r16:'1/16',r8:'Octavos',qf:'Cuartos',sf:'Semis','34':'3er Puesto',final:'Final'};
function mCard(m) {
  const played=m.homeG!==null&&m.awayG!==null;
  const today=isToday(m.date);
  const sub=m.phase==='groups'?`Grupo ${m.group} · ${m.round}`:PLBL[m.phase];
  const key=`${m.home}-${m.away}`;
  const scored=S.scoredMatches&&S.scoredMatches[key];
  const isLive=today&&!scored;
  let cls='mcard'; if(today) cls+=' today'; if(played) cls+=' played'; if(scored) cls+=' finished';
  return `<div class="${cls}">
    <div class="mcard-date">
      <span>${fmtDate(m.date)}</span>
      <span style="color:var(--border)">·</span>
      <span>${m.time||''}</span>
      ${isLive?'<span class="live-dot">EN VIVO</span>':''}

    </div>

        <div class="mteam-name">${m.home||'?'}</div>
      </div>
      <div class="mscore-box">
        ${played
          ?`<div class="mscore-num ${scored?'scored':''}">${m.homeG}<span class="mscore-sep">-</span>${m.awayG}</div>`
          :'<div class="mscore-vs">VS</div>'}
        <div class="mscore-phase">${sub}</div>
      </div>
      <div class="mteam">
        <div class="mteam-flag">${flag(m.away)}</div>

}

function photoSrc(name) {

    ? `<img src="${src}" alt="${name}" onerror="${fallback}">`

// Returns "sign|home-away" e.g. "1|2-0", "X|1-1", "2|0-1"
function findResult(label) {
  const clean = label.replace(/\n.*/,'').trim();
  // Label format: "México-Sudáfrica" or "TeamA - TeamB"
  const sep = clean.includes(' - ') ? ' - ' : '-';
  const parts = clean.split(sep);
  if (parts.length < 2) return null;
  const hq = parts[0].trim().toLowerCase().substring(0, 5);
  const aq = parts[parts.length-1].trim().toLowerCase().substring(0, 5);
  const m = S.matches.find(m =>
    m.home.toLowerCase().startsWith(hq) || m.away.toLowerCase().startsWith(aq)
  );
  if (!m || m.homeG === null || m.awayG === null) return null;
  const sign = m.homeG > m.awayG ? '1' : m.homeG === m.awayG ? 'X' : '2';
  return `${sign}|${m.homeG}-${m.awayG}`;
}

// Classify a prediction against the actual result
// Returns: 'exact' | 'signdiff' | 'signok' | 'wrong' | ''
function classifyPred(pred, result) {
  if (!result || !pred) return '';
  const [pSign, pScore] = pred.split('|');
  const [rSign, rScore] = result.split('|');
  if (!pSign || !rSign) return '';
  if (pred === result) return 'exact';
  if (pSign !== rSign) return 'wrong';
  // Sign correct — check goal difference
  const [ph, pa] = (pScore||'').split('-').map(Number);
  const [rh, ra] = (rScore||'').split('-').map(Number);
  if (!isNaN(ph) && !isNaN(pa) && !isNaN(rh) && !isNaN(ra)) {
    if ((ph - pa) === (rh - ra)) return 'signdiff';
  }
  return 'signok';
}
const PRED_LABELS = { exact:'5 pts', signdiff:'2 pts', signok:'1 pt', wrong:'0 pts' };

function renderPredictions() {
  const sel  = document.getElementById('pred-sel');
  const wrap = document.getElementById('pred-content');
  const key  = sel.value;
  if (!key || !S.predictions[key]) {
    wrap.innerHTML = `<div class="empty"><div class="empty-icon">🎯</div><h3>Sin predicciones</h3><p>Sube el Excel desde Admin o selecciona un partido</p></div>`;
    return;
  }
  const result = findResult(key);
  // Sort by pts if result known
  const items = [...S.predictions[key]];
  if (result) {
    const order = { exact:0, signdiff:1, signok:2, wrong:3, '':4 };
    items.sort((a,b) => order[classifyPred(a.pred,result)] - order[classifyPred(b.pred,result)]);
  }
  const resHtml = result
    ? `<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)">
        <span style="font-size:.65rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)">Resultado</span>
        <span style="font-size:1.1rem;font-weight:900;letter-spacing:-0.5px;color:var(--gold)">${result}</span>
        <span style="font-size:.68rem;color:var(--muted);margin-left:4px">${signLabel(result.split('|')[0])}</span>
      </div>`
    : `<div style="font-size:.78rem;color:var(--muted);margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)">Partido pendiente — se mostrarán los puntos al conocerse el resultado</div>`;
  wrap.innerHTML = resHtml + items.map((it, i) => {
    const cls = classifyPred(it.pred, result);
    return `<div class="pred-row">
      <div class="pred-i">${i+1}</div>
      <div class="pred-name">${it.name}</div>
      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
        <div class="pred-chip ${cls}">${it.pred}</div>
        ${cls ? `<div class="pred-pts-badge ${cls}">${PRED_LABELS[cls]}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}
function signLabel(s) {
  return s==='1'?'Victoria local':s==='X'?'Empate':s==='2'?'Victoria visitante':'';
}

function onLiveMatchChange(){
  const sel=document.getElementById('live-match-sel');
  if(!sel) return;
  const key=sel.value;
  // Try to find the match in S.matches for team names
  const parts=key.split(/\s*-\s*/);
  const home=parts[0]||key;
  const away=parts.slice(1).join('-')||'';
  const hn=document.getElementById('live-home-name');
  const an=document.getElementById('live-away-name');
  if(hn) hn.textContent=home;
  if(an) an.textContent=away;
  // Pre-fill with existing scored result if any
  const existing=S.scoredMatches&&S.scoredMatches[key];
  if(existing){
    const scoreStr=existing.split('|')[1]||'0-0';
    const [hg,ag]=scoreStr.split('-').map(Number);
    const hIn=document.getElementById('live-home-g');
    const aIn=document.getElementById('live-away-g');
    if(hIn) hIn.value=isNaN(hg)?0:hg;
    if(aIn) aIn.value=isNaN(ag)?0:ag;
  }
  previewLiveScore();
}

function previewLiveScore(){
  const hg=parseInt(document.getElementById('live-home-g')?.value,10)||0;
  const ag=parseInt(document.getElementById('live-away-g')?.value,10)||0;
  const sign=hg>ag?'1':hg===ag?'X':'2';
  const signLabel=sign==='1'?'Victoria local':sign==='X'?'Empate':'Victoria visitante';
  const pv=document.getElementById('live-score-preview');
  if(pv) pv.innerHTML=`Resultado: <b style="color:var(--gold)">${sign}|${hg}-${ag}</b> <span style="opacity:.6">(${signLabel})</span>`;
}

function updateLiveScore(finish){
  const sel=document.getElementById('live-match-sel');
  if(!sel) return;
  const key=sel.value;
  const hg=parseInt(document.getElementById('live-home-g')?.value,10);
  const ag=parseInt(document.getElementById('live-away-g')?.value,10);
  if(isNaN(hg)||isNaN(ag)){alert('Introduce un marcador valido');return;}

  const sign=hg>ag?'1':hg===ag?'X':'2';
  const result=`${sign}|${hg}-${ag}`;

  // Update match result in S.matches if the match exists there
  const parts=key.split(/\s*-\s*/);
  const hTeam=parts[0]||key;
  const aTeam=parts.slice(1).join('-');
  const mObj=S.matches.find(m=>m.home===hTeam&&m.away===aTeam);
  if(mObj){ mObj.homeG=hg; mObj.awayG=ag; }
  else {
    // Add match if missing
    S.matches.push({id:S.matches.length+1,group:'?',phase:'groups',
      date:new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}),
      time:'',round:'',home:hTeam,away:aTeam||'?',homeG:hg,awayG:ag});
  }

  if(!S.predictions[key]||!S.predictions[key].length){
    alert('No hay predicciones guardadas para este partido. Importalas primero.');return;
  }

  applyMatchPoints(key, result);
  S.lastUpdated=new Date().toISOString();
  saveS(); renderAll();

  const st=document.getElementById('live-score-status');
  if(st) st.innerHTML=`<div class="alert a-ok">${finish?'Partido finalizado y':'Clasificacion actualizada con'} marcador <b>${hg}-${ag}</b>. ${S.predictions[key].length} predicciones recalculadas.</div>`;
}

// ── Levenshtein distance ────────────────────────────────────────────
function levDist(a,b){
  const m=a.length,n=b.length;
  const d=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i||j));
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]:1+Math.min(d[i-1][j-1],d[i-1][j],d[i][j-1]);
  return d[m][n];
}
function fuzzyName(raw){
  if(!raw||raw.length<2) return null;
  const norm=raw.toLowerCase().replace(/[^a-z\s]/gi,'').trim();
  if(!norm) return null;
  // exact
  let m=S.participants.find(p=>p.name.toLowerCase()===norm); if(m) return m.name;
  // first word
  const w=norm.split(' ')[0];
  m=S.participants.find(p=>p.name.toLowerCase().startsWith(w)&&w.length>3); if(m) return m.name;
  // levenshtein <= 3
  let best=null,bd=4;
  for(const p of S.participants){
    const d=levDist(norm,p.name.toLowerCase());
    if(d<bd){bd=d;best=p;}
  }
  return best?best.name:null;
}

// ── Paste-from-Excel parser ─────────────────────────────────────────
function parsePasteData(raw){
  const lines = raw.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  const entries = [];
  let matchName = '', matchResult = '';
  const RESULT_PAR = /\(?([12X])\|(\d+)-(\d+)\)?/i;
  const PRED_EXACT = /^([12X])\|(\d+)-(\d+)$/i;

  for(const rawLine of lines){
    const cols = rawLine.split('\t').map(c=>c.trim());

    for(const col of cols){
      // Result in parens: (1|2-1)
      const rm = col.match(/\(([12X])\|(\d+)-(\d+)\)/i);
      if(rm){ matchResult=`${rm[1].toUpperCase()}|${rm[2]}-${rm[3]}`; }
      // Match name: non-empty col that isn't a prediction, not "Nombre", not a number
      else if(col.length>3 && !/^\(/.test(col) && !/\|/.test(col) && !/^\d+$/.test(col)
              && col.toLowerCase()!=='nombre' && !fuzzyName(col)){
        if(!matchName) matchName=col;
        else if(!matchName.includes(col.substring(0,6))) matchName+=' '+col;
      }
    }

    // Player row: col[0]=name, col[1]=prediction
    if(cols.length>=2){
      const nameRaw=cols[0];
      const predRaw=cols[1];
      if(nameRaw && nameRaw.toLowerCase()!=='nombre'){
        const name=fuzzyName(nameRaw);
        const pm=predRaw?.match(PRED_EXACT);
        if(name && pm && !entries.find(e=>e.name===name)){
          entries.push({name, pred:`${pm[1].toUpperCase()}|${pm[2]}-${pm[3]}`});
        }
      }
    }
  }

  return {matchName:matchName.trim(), matchResult, entries};
}

// ── OCR text normalization ──────────────────────────────────────────
function normOCR(s){
  return s
    // Fix | misread as adjacent character: l I / \ : ; !
    .replace(/([12X])([lI\/\\:;!])(\d)/gi,(_,sign,__,d)=>`${sign.toUpperCase()}|${d}`)
    // Fix hyphen variants in score
    .replace(/(\d)[—–](\d)/g,'$1-$2')
    .replace(/\s+/g,' ')
    .trim();
}

// Is this line structural noise we should skip?
function isNoiseLine(line){
  return /pegar\s+valores|^nombre$|^pos$|puntos.{0,25}d[ií]a|d[ií]a\s+seleccionado|eliminatoria/i.test(line);
}

// Does line look like it contains a player name only (no digits/prediction)?
function looksLikeName(line){
  return line.length>=2 && !/[|]/.test(line) && !/^\d+$/.test(line);
}

function parseOCRAndShow(text, container){
  const rawLines = text.split('\n').map(l=>l.trim()).filter(l=>l.length>1);
  const lines    = rawLines.map(normOCR);
  // Separator between sign and score: | or any common OCR misread (l I / \ : ; !) or even a space
  const PRED_RX  = /\b([12X])[\s|lI\/\\:;!](\d+)-(\d+)\b/i;
  // Result in parentheses: same flexible separator
  const RES_RX   = /[\(\[{]([12X])[\s|lI\/\\:;!](\d+)-(\d+)[\)\]}]/i;

  // ── PASS 1: find result and match name ─────────────────────────
  let matchResult = null;
  let resultLineIdx = -1;

  for(let i=0;i<lines.length;i++){
    const m = lines[i].match(RES_RX);
    if(m){ matchResult=`${m[1]}|${m[2]}-${m[3]}`; resultLineIdx=i; break; }
  }

  // Build match name from lines ABOVE the result line (up to 3 lines back)
  let matchName = '';
  if(resultLineIdx>=0){
    const nameParts=[];
    for(let j=resultLineIdx-1; j>=Math.max(0,resultLineIdx-3); j--){
      const l=lines[j];
      if(isNoiseLine(l)) break;
      if(l.length>2 && !/\d/.test(l)) nameParts.unshift(l);
    }
    // Also check if result line itself has a name before the parenthesis
    const beforeParen = lines[resultLineIdx].replace(RES_RX,'').trim();
    if(beforeParen.length>2 && !/\d/.test(beforeParen)) nameParts.unshift(beforeParen);
    matchName = nameParts.join(' ').replace(/\s*-\s*/g,'-').trim();
  }

  // ── PASS 2: extract predictions ────────────────────────────────
  const entries=[];
  const seen=new Set();
  const isPointsMode = lines.join(' ').match(/puntos.{0,25}d[ií]a|puntos.{0,25}elimin/i);

  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(isNoiseLine(line)) continue;

    const pm = line.match(PRED_RX);

    if(pm && !isPointsMode){
      const pred=`${pm[1].toUpperCase()}|${pm[2]}-${pm[3]}`;
      const predIdx = line.search(PRED_RX); // use search() so it works regardless of OCR separator

      // Name candidate: text before prediction on this line
      let namePart = line.substring(0,predIdx).replace(/^\d+\s+/,'').trim();

      // If empty (prediction is at start of line), look at previous non-noise line
      if(!namePart){
        for(let j=i-1;j>=Math.max(0,i-2);j--){
          const prev=lines[j];
          if(!isNoiseLine(prev) && looksLikeName(prev)){
            namePart=prev.replace(/^\d+\s+/,'').trim();
            break;
          }
        }
      }

      const name = fuzzyName(namePart);
      if(name && !seen.has(name)){ seen.add(name); entries.push({name,pred}); }
    }

    // Points mode: "1 Xavi Riu 5 5 -" — extract name + match pts (col 4)
    if(isPointsMode){
      const rowM = line.match(/^(\d+)?\s+(.{3,28}?)\s{2,}(\d+)\s+(\d+)/);
      if(rowM){
        const name=fuzzyName(rowM[2].trim());
        const pts=parseInt(rowM[4],10);
        if(name && !seen.has(name)){ seen.add(name); entries.push({name,pred:'',pts}); }
      }
    }
  }

  showOCRPreview(matchName, matchResult, entries, container);
}

let _importContainerId = 'ocr-preview';
let _importStatusId    = 'ocr-status';

// ── Show editable preview ───────────────────────────────────────────
function showOCRPreview(matchName, matchResult, entries, container, statusEl){
  _importContainerId = container.id || 'ocr-preview';
  _importStatusId    = statusEl?.id || (container.id==='paste-preview'?'paste-status':'ocr-status');

  const imgHtml = container.querySelector('img') ? container.querySelector('img').outerHTML : '';
  const opts = S.participants.map(p=>`<option value="${p.name}">${p.name}</option>`).join('');
  const alreadyScored = matchResult && S.scoredMatches && S.scoredMatches[matchName];
  const total = S.participants.length;
  const found = entries.length;
  const missing = total - found;
  const isPointsMode = entries.length && entries[0].pts !== undefined;
  const isPaste = container.id === 'paste-preview';

  // Status banner
  let banner;
  if(!found){
    banner=`<div class="alert a-inf" style="margin-bottom:10px">${isPaste?'No se detectaron predicciones en el texto pegado. Revisa el formato.':'No se detectaron predicciones. Rellena manualmente o sube otra captura.'}</div>`;
  } else if(missing>0){
    banner=`<div class="alert a-inf" style="margin-bottom:10px">Pre-rellenadas <b>${found}/${total}</b> predicciones <span style="color:#4ade80">(✓)</span>. Completa las marcadas con <b>?</b> y confirma.</div>`;
  } else {
    banner=`<div class="alert a-ok" style="margin-bottom:10px">Los ${found} jugadores detectados correctamente. Revisa y confirma.</div>`;
  }

  if(alreadyScored){
    banner+=`<div class="ocr-warn" style="margin-bottom:10px">⚠️ Este partido ya fue puntuado. Al confirmar se recalculan los puntos.</div>`;
  }

  // Table columns depend on mode
  const thead = isPointsMode
    ? `<tr><th>Jugador</th><th>Pts partido</th><th></th></tr>`
    : `<tr><th>Jugador</th><th>Predicción</th><th class="ocr-th-status"></th></tr>`;

  // Build lookup map from OCR entries
  const ocrMap = {};
  entries.forEach(e => { ocrMap[e.name] = e; });

  // Always render ALL participants — OCR pre-fills what it detected
  const allRows = S.participants.map(p => {
    const e = ocrMap[p.name];
    const selHtml = opts.replace(`value="${p.name}"`, `value="${p.name}" selected`);
    const valCol = isPointsMode
      ? `<input class="ocr-pred-input" value="${e?.pts??''}" maxlength="3" placeholder="0" style="max-width:60px">`
      : `<input class="ocr-pred-input ${e?'ocr-filled':''}" value="${e?.pred||''}" maxlength="7" placeholder="1|2-0">`;
    const statusIcon = !isPointsMode ? (e ? `<span class="ocr-status-ok" title="Detectado por OCR">✓</span>` : `<span class="ocr-status-miss" title="Rellena manualmente">?</span>`) : '';
    return `<tr class="ocr-entry-row">
      <td><select class="ocr-name-sel">${selHtml}</select></td>
      <td>${valCol}</td>
      <td>${statusIcon}</td>
    </tr>`;
  }).join('');

  const rows = S.participants.length ? allRows
    : `<tr class="ocr-entry-row">
        <td><select class="ocr-name-sel">${opts}</select></td>
        <td><input class="ocr-pred-input" value="" maxlength="7" placeholder="${isPointsMode?'0':'1|2-0'}"></td>
        <td></td>
      </tr>`;

  container.innerHTML=`
    ${imgHtml}
    ${banner}
    <div class="ocr-match-inputs">
      <label><span>Partido</span>
        <input class="ocr-match-name-input" id="ocr-match-name" value="${matchName}" placeholder="México-Sudáfrica">
      </label>
      <label><span>Resultado final</span>
        <input class="ocr-result-input" id="ocr-match-result" value="${matchResult||''}" placeholder="1|2-0" maxlength="7">
      </label>
    </div>
    <table class="ocr-preview-table">
      <thead>${thead}</thead>
      <tbody id="ocr-tbody">${rows}</tbody>
    </table>
    <button class="ocr-add-row" onclick="addOCRRow()">+ Añadir jugador</button>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-gold" onclick="confirmOCRImport()">Guardar y actualizar tablero</button>
      <button class="btn btn-ghost" onclick="cancelImport()">Cancelar</button>
    </div>`;
}

function addOCRRow(){
  const opts=S.participants.map(p=>`<option value="${p.name}">${p.name}</option>`).join('');
  const tr=document.createElement('tr');
  tr.className='ocr-entry-row';
  tr.innerHTML=`<td><select class="ocr-name-sel">${opts}</select></td>
    <td><input class="ocr-pred-input" value="" maxlength="6" placeholder="1|2-0"></td>
    <td><button class="ocr-row-del" onclick="this.closest('tr').remove()">✕</button></td>`;
  document.getElementById('ocr-tbody').appendChild(tr);
}

function confirmOCRImport(){
  const matchName=document.getElementById('ocr-match-name').value.trim();
  const matchResult=document.getElementById('ocr-match-result').value.trim().toUpperCase();
  if(!matchName){alert('Indica el nombre del partido');return;}

  // Read rows
  const rows=[...document.querySelectorAll('.ocr-entry-row')];
  const entries=rows.map(r=>({
    name:r.querySelector('.ocr-name-sel').value,
    pred:r.querySelector('.ocr-pred-input').value.trim().toUpperCase()
  })).filter(e=>e.name&&e.pred&&/^[1X2]\|\d+-\d+$/.test(e.pred));

  if(!entries.length){alert('No hay predicciones validas (formato: 1|2-0)');return;}

  // Save predictions
  S.predictions[matchName]=entries;

  // Update match result in S.matches
  if(matchResult&&/^[1X2]\|\d+-\d+$/.test(matchResult)){
    const[,scoreStr]=matchResult.split('|');
    const[hg,ag]=scoreStr.split('-').map(Number);
    // Find existing match by home team name (first token before dash)
    const homeQ=matchName.split(/\s*[-–]\s*/)[0].toLowerCase().trim();
    let m=S.matches.find(m=>
      m.home.toLowerCase().includes(homeQ.substring(0,5))||
      homeQ.includes(m.home.toLowerCase().substring(0,5))
    );
    if(m){
      m.homeG=hg; m.awayG=ag;
    } else {
      // Add match if not in list yet (not loaded from Excel)
      const parts=matchName.split(/\s*[-–]\s*/);
      S.matches.push({
        id:S.matches.length+1, group:'?', phase:'groups',
        date:new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}),
        time:'', round:'',
        home:parts[0]||matchName, away:parts.slice(1).join('-')||'?',
        homeG:hg, awayG:ag
      });
    }
    applyMatchPoints(matchName,matchResult);
  }

  S.lastUpdated=new Date().toISOString();
  saveS();renderAll();renderAdmin();
  const stEl=document.getElementById(_importStatusId);
  if(stEl) stEl.innerHTML=`<div class="alert a-ok">Guardado. Tablero actualizado con ${entries.length} predicciones.</div>`;
  const pvEl=document.getElementById(_importContainerId);
  if(pvEl) pvEl.innerHTML='';
  // Clear paste textarea if that was the source
  const ta=document.getElementById('paste-input');
  if(ta) ta.value='';
}

function cancelImport(){
  const pvEl=document.getElementById(_importContainerId);
  const stEl=document.getElementById(_importStatusId);
  if(pvEl) pvEl.innerHTML='';
  if(stEl) stEl.innerHTML='';
  const ta=document.getElementById('paste-input');
  if(ta) ta.value='';
}

function applyMatchPoints(matchName, result){
  if(!S.scoredMatches) S.scoredMatches={};
  // Reverse previous scoring for this match if it was already scored
  if(S.scoredMatches[matchName]){
    const prevResult=S.scoredMatches[matchName];
    const prevPreds=S._prevPreds&&S._prevPreds[matchName]||[];
    prevPreds.forEach(({name,pred})=>{
      const pts={exact:5,signdiff:2,signok:1,wrong:0,'':0}[classifyPred(pred,prevResult)]||0;
      const p=S.participants.find(p=>p.name===name);
      if(p){p.totalPts=Math.max(0,p.totalPts-pts);p.gPts=Math.max(0,p.gPts-pts);}
    });
  }
  // Apply new scoring
  const preds=S.predictions[matchName]||[];
  if(!S._prevPreds) S._prevPreds={};
  S._prevPreds[matchName]=preds.map(e=>({...e}));
  preds.forEach(({name,pred})=>{
    const pts={exact:5,signdiff:2,signok:1,wrong:0,'':0}[classifyPred(pred,result)]||0;
    const p=S.participants.find(p=>p.name===name);
    if(p){p.totalPts+=pts;p.gPts+=pts;}
  });
  S.scoredMatches[matchName]=result;
  S.participants.sort((a,b)=>b.totalPts-a.totalPts);
  S.participants.forEach((p,i)=>p.pos=i+1);
}

// Merge FULL_SCHEDULE into S.matches, preserving existing results
function mergeSchedule(){
  FULL_SCHEDULE.forEach(fsm=>{
    const exists=S.matches.find(m=>m.home===fsm.home&&m.away===fsm.away);
    if(!exists) S.matches.push({...fsm});
    // If match exists but has no time/date from Excel import, fill it in
    else if(!exists.time&&fsm.time){ exists.date=fsm.date; exists.time=fsm.time; exists.round=fsm.round; exists.group=fsm.group; }
  });
  // Sort by date then time
  S.matches.sort((a,b)=>{
    const da=a.date.split('/').reverse().join(''),db=b.date.split('/').reverse().join('');
    if(da!==db) return da<db?-1:1;
    return (a.time||'').localeCompare(b.time||'');
  });
  saveS();
}
